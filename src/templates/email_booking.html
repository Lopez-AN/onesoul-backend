<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva confirmada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Helvetica, Arial, sans-serif;">

  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 6px;">
    <tr>
      <td style="padding: 20px; text-align: center;">
        <img src="cid:logo" alt="OneSoul Logo" style="width: 200px; margin-bottom: 20px;">
        
        <h1 style="font-size: 22px; margin: 0 0 20px;">&iexcl;Hola {USERNAME}&#33;</h1>

        <p style="font-size: 16px; margin: 0 0 10px;">Tu reserva fue confirmada con &eacute;xito.</p>
        <p style="font-size: 16px; margin: 0 0 10px;">Servicio: <strong>{OFFERING}</strong></p>
        <p style="font-size: 16px; margin: 0 0 10px;">Modalidad: <strong>{MODE}</strong></p>
        <p style="font-size: 16px; margin: 0 0 10px;">Fecha y hora: <strong>{SCHEDULED}</strong></p>
        <p style="font-size: 16px; margin: 0 0 10px;">ID de la reserva: <strong>{BOOKING_ID}</strong></p>

        <p style="font-size: 16px; margin: 30px 0 0;">Pod&eacute;s acceder a tu panel desde:<br>
          <a href="{DASHBOARD_URL}" style="color: #007BFF;">{DASHBOARD_URL}</a>
        </p>
      </td>
    </tr>

    <tr>
      <td style="padding: 15px; text-align: center; font-size: 12px; color: #999999;">
        <p style="margin: 0;">&copy; OneSoul.app - Todos los derechos reservados</p>
      </td>
    </tr>
  </table>

</body>
</html>
