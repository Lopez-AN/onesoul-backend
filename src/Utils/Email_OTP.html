<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your login</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      padding: 20px;
      background-color:  #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin: 50px auto;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 24px;
    }
    p {
      margin-bottom: 16px;
      font-size: 16px;
    }
    .code {
      font-size: 26px;
      font-weight: bold;
      margin: 16px 0;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="onesoul-raster.png" alt="Company" style="width: 250px; margin-bottom: 20px;">
    <h1>Verification code</h1>
    <p>Please use the verification code below to sign in.</p>
    <p id="otp_cod" class="code"></p>
    <p>If you didn't request this, you can ignore this email.</p>
    <p>Thanks,<br>OneSoul.app</p>
    <div class="footer">
      <p>&copy; Todos los derechos reservados</p>
    </div>
  </div>

  <script>
    document.getElementById('otp_cod').innerText = Math.floor(100000 + Math.random() * 900000);
  </script>
</body>

</html>
