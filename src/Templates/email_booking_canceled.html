<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva cancelada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f9f9f9; font-family: Helvetica, Arial, sans-serif;">

  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f9f9f9; padding: 20px 0;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.06); overflow: hidden;">

          <!-- HEADER -->
          <tr>
            <td align="center" style="padding: 30px 20px 10px;">
              <img src="cid:logo" alt="OneSoul Logo" style="max-width: 180px; margin-bottom: 20px;">
              <h2 style="font-size: 24px; color: #333333; margin: 0;">Tu reserva fue cancelada</h2>
              <p style="font-size: 16px; color: #555555; margin: 10px 0 0;">
                Se cancelo la reserva <strong>{BOOKING_ID}</strong> del servicio <strong>{OFFERING}</strong>.
              </p>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding: 30px 40px;">
              <p style="font-size: 16px; color: #333333;">
                <strong>Mensaje enviado al guía:</strong><br>
                {MESSAGE}
              </p>

              <div style="text-align: center; margin: 30px 0;">
                <a href="{BOOKING_URL}" style="background-color: #00b894; color: #ffffff; padding: 14px 24px; text-decoration: none; font-weight: bold; border-radius: 6px; display: inline-block; font-size: 16px;">
                  Ver mis reservas
                </a>
              </div>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding: 20px; text-align: center; font-size: 12px; color: #999999; background-color: #fafafa;">
              © {YEAR} OneSoul.app - Todos los derechos reservados
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
